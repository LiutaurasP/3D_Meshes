name: Headless display
description: >
  Virtual display and software OpenGL for VTK on machines without a GPU.
  Linux uses pyvista/setup-headless-display-action. On Windows Mesa is
  installed here: the download is kept in the Actions cache, and when it is
  not cached yet it is fetched with the workflow's own GitHub login (plain
  downloads from the CI machines are refused now and then).

inputs:
  mesa-version:
    description: Mesa release from github.com/pal1000/mesa-dist-win
    required: false
    default: "24.3.0"
  token:
    description: GitHub token for the download
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      uses: pyvista/setup-headless-display-action@v3
      with:
        qt: true

    - name: Mesa from the cache
      if: runner.os == 'Windows'
      id: cache
      uses: actions/cache@v4
      with:
        path: mesa-download
        key: mesa3d-${{ inputs.mesa-version }}-release-msvc

    - name: Download Mesa
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.mesa-version }}
      run: |
        set -o pipefail
        NAME="mesa3d-$VERSION-release-msvc.7z"
        API="https://api.github.com/repos/pal1000/mesa-dist-win"
        AUTH=()
        [ -n "$GH_TOKEN" ] && AUTH=(-H "Authorization: Bearer $GH_TOKEN")
        mkdir -p mesa-download
        # Through the API, not the github.com/.../releases/download link: that link
        # answered 504 for every Mesa file for hours while the API route kept working
        for attempt in 1 2 3 4 5; do
          rm -f "mesa-download/$NAME"
          ASSET=$(curl -fsSL "${AUTH[@]}" "$API/releases/tags/$VERSION" \
            | python -c "import json,sys; print(next(a['id'] for a in json.load(sys.stdin)['assets'] if a['name']=='$NAME'))") \
            && curl -fsSL --retry 3 --retry-all-errors --connect-timeout 30 "${AUTH[@]}" \
              -H "Accept: application/octet-stream" -o "mesa-download/$NAME" "$API/releases/assets/$ASSET" \
            || true
          if [ -f "mesa-download/$NAME" ] && [ "$(stat -c %s "mesa-download/$NAME")" -gt 1000000 ] \
             && 7z t "mesa-download/$NAME" > /dev/null; then
            exit 0
          fi
          [ "$attempt" = 5 ] && break
          echo "Download attempt $attempt failed, trying again in $((attempt * 15)) s"
          sleep $((attempt * 15))
        done
        echo "::error::Could not download Mesa $VERSION from github.com/pal1000/mesa-dist-win"
        exit 1

    - name: Install software OpenGL (Mesa) on Windows
      if: runner.os == 'Windows'
      shell: bash
      env:
        MESA: mesa3d-${{ inputs.mesa-version }}-release-msvc
      run: |
        set -eo pipefail
        7z x "mesa-download/$MESA.7z" -o"./$MESA" > /dev/null
        # 1 = install the OpenGL drivers, 7 = update the system-wide deployment
        cmd.exe //c "$MESA\\systemwidedeploy.cmd 1"
        cmd.exe //c "$MESA\\systemwidedeploy.cmd 7"
        rm -rf "$MESA"
        echo "PYVISTA_OFF_SCREEN=true" >> "$GITHUB_ENV"
